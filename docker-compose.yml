services:
  localclaw-gateway:
    image: ${LOCALCLAW_IMAGE:-localclaw:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      LOCALCLAW_GATEWAY_TOKEN: ${LOCALCLAW_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${LOCALCLAW_CONFIG_DIR}:/home/node/.localclaw
      - ${LOCALCLAW_WORKSPACE_DIR}:/home/node/.localclaw/workspace
    ports:
      - "${LOCALCLAW_GATEWAY_PORT:-18789}:18789"
      - "${LOCALCLAW_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${LOCALCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]

  localclaw-cli:
    image: ${LOCALCLAW_IMAGE:-localclaw:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      LOCALCLAW_GATEWAY_TOKEN: ${LOCALCLAW_GATEWAY_TOKEN}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${LOCALCLAW_CONFIG_DIR}:/home/node/.localclaw
      - ${LOCALCLAW_WORKSPACE_DIR}:/home/node/.localclaw/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
