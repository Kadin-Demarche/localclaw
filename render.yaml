services:
  - type: web
    name: localclaw
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: LOCALCLAW_STATE_DIR
        value: /data/.localclaw
      - key: LOCALCLAW_WORKSPACE_DIR
        value: /data/workspace
      - key: LOCALCLAW_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: localclaw-data
      mountPath: /data
      sizeGB: 1
